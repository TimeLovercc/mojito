[package]
name = "mojito-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "mojito_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-http = "2"
keyring = { version = "3", features = ["apple-native"] }
serde_json = "1"
tauri-plugin-autostart = "2.6.0"
mac-notification-sys = "0.6.15"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["time"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
sha2 = "0.11.0"
