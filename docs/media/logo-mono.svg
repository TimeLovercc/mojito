<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Mojito (one colour)</title>
  <desc>Single-colour silhouette of logo.svg: Android themed icon and notification icon (mobile/scripts/make-icons.py). Drawn for Mojito; MIT licensed like the rest of the repository (LICENSE).</desc>
  <defs>
    <path id="glass" d="M292 340 L732 340 L698 816 Q694 872 638 872 L386 872 Q330 872 326 816 Z"/>
    <clipPath id="inside">
      <use href="#glass"/>
    </clipPath>
    <path id="leaf" d="M0 0 C60 -54 170 -54 232 0 C170 54 60 54 0 0 Z"/>
    <mask id="shape" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#000000"/>
      <!-- glass: outline, solid drink with ice cut out -->
      <use href="#glass" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linejoin="round"/>
      <g clip-path="url(#inside)">
        <rect x="260" y="470" width="500" height="430" fill="#FFFFFF"/>
        <rect x="382" y="520" width="112" height="112" rx="22" fill="#000000" transform="rotate(-12 438 576)"/>
        <rect x="536" y="590" width="104" height="104" rx="22" fill="#000000" transform="rotate(14 588 642)"/>
      </g>
      <!-- mint sprig, separated from the rim by a gap -->
      <g transform="translate(646 330)">
        <g stroke="#000000" stroke-width="26" stroke-linejoin="round">
          <use href="#leaf" transform="rotate(-104)"/>
          <use href="#leaf" transform="rotate(-18)"/>
          <use href="#leaf" transform="rotate(-60)"/>
        </g>
        <g fill="#FFFFFF">
          <use href="#leaf" transform="rotate(-104)"/>
          <use href="#leaf" transform="rotate(-18)"/>
          <use href="#leaf" transform="rotate(-60)"/>
        </g>
        <g stroke="#000000" stroke-width="12" stroke-linecap="round">
          <path d="M22 0 L200 0" transform="rotate(-104)"/>
          <path d="M22 0 L200 0" transform="rotate(-18)"/>
          <path d="M22 0 L200 0" transform="rotate(-60)"/>
        </g>
      </g>
      <!-- lime wheel, separated from the rim by a gap -->
      <g transform="translate(316 326)">
        <circle r="142" fill="#000000"/>
        <circle r="124" fill="#FFFFFF"/>
        <circle r="102" fill="#000000"/>
        <circle r="88" fill="#FFFFFF"/>
        <g stroke="#000000" stroke-width="14" stroke-linecap="round">
          <path d="M0 -80 L0 80"/>
          <path d="M-80 0 L80 0"/>
          <path d="M-57 -57 L57 57"/>
          <path d="M-57 57 L57 -57"/>
        </g>
      </g>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="#FFFFFF" mask="url(#shape)"/>
</svg>
