<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Mojito</title>
  <desc>A mojito glass with a lime wheel and a mint sprig. Source of every app icon (mobile/scripts/make-icons.py). Drawn for Mojito; MIT licensed like the rest of the repository (LICENSE).</desc>
  <defs>
    <path id="glass" d="M292 340 L732 340 L698 816 Q694 872 638 872 L386 872 Q330 872 326 816 Z"/>
    <clipPath id="inside">
      <use href="#glass"/>
    </clipPath>
    <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2F4DF"/>
      <stop offset="1" stop-color="#86D9A9"/>
    </linearGradient>
    <path id="leaf" d="M0 0 C60 -54 170 -54 232 0 C170 54 60 54 0 0 Z"/>
    <path id="bit" d="M0 0 C18 -20 52 -20 70 0 C52 20 18 20 0 0 Z"/>
  </defs>

  <!-- glass and drink -->
  <use href="#glass" fill="#F4FCF7"/>
  <g clip-path="url(#inside)">
    <rect x="260" y="452" width="500" height="440" fill="url(#drink)"/>
    <rect x="260" y="452" width="500" height="18" fill="#E8FAEF"/>
    <!-- ice -->
    <rect x="382" y="500" width="118" height="118" rx="22" fill="#F4FFF8" fill-opacity="0.8" stroke="#B7E8CB" stroke-width="8" transform="rotate(-12 441 559)"/>
    <rect x="530" y="556" width="112" height="112" rx="22" fill="#F4FFF8" fill-opacity="0.8" stroke="#B7E8CB" stroke-width="8" transform="rotate(14 586 612)"/>
    <!-- muddled mint -->
    <use href="#bit" fill="#2E9E5B" transform="translate(392 818) rotate(-28)"/>
    <use href="#bit" fill="#28894F" transform="translate(520 836) rotate(-8)"/>
    <use href="#bit" fill="#2E9E5B" transform="translate(588 800) rotate(24)"/>
    <!-- bubbles -->
    <circle cx="470" cy="700" r="12" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="640" cy="720" r="9" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="610" cy="500" r="10" fill="#FFFFFF" fill-opacity="0.85"/>
    <!-- mint stem in the drink -->
    <path d="M592 820 Q610 560 646 330" fill="none" stroke="#1F7A45" stroke-width="18" stroke-linecap="round"/>
    <!-- highlight -->
    <path d="M350 408 L376 776" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="24" stroke-linecap="round"/>
  </g>
  <use href="#glass" fill="none" stroke="#134E3A" stroke-width="28" stroke-linejoin="round"/>

  <!-- mint sprig above the rim -->
  <g transform="translate(646 330)">
    <g transform="rotate(-104)">
      <use href="#leaf" fill="#2E9E5B"/>
      <path d="M18 0 L204 0" stroke="#A3E3BD" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g transform="rotate(-18)">
      <use href="#leaf" fill="#2E9E5B"/>
      <path d="M18 0 L204 0" stroke="#A3E3BD" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g transform="rotate(-60)">
      <use href="#leaf" fill="#38B26A"/>
      <path d="M18 0 L204 0" stroke="#B9EDCD" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- lime wheel on the rim -->
  <g transform="translate(316 326)">
    <circle r="124" fill="#4E9A25"/>
    <circle r="106" fill="#F2F9D4"/>
    <circle r="94" fill="#B8E257"/>
    <g stroke="#F2F9D4" stroke-width="11" stroke-linecap="round">
      <path d="M0 -84 L0 84"/>
      <path d="M-84 0 L84 0"/>
      <path d="M-59 -59 L59 59"/>
      <path d="M-59 59 L59 -59"/>
    </g>
    <circle r="15" fill="#F2F9D4"/>
  </g>
</svg>
